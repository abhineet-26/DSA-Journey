name: Sync LeetCode Submissions
on:
  workflow_dispatch: 
  schedule:
    - cron: '15 07 * * *'
    - cron: '15 18 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Patched LeetCode Sync
        # Swapping from @v1.7 to @master to fetch the active community formatting patch
        uses: joshcai/leetcode-sync@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          destination-folder: 'leetcode-solutions'
          verbose: true
